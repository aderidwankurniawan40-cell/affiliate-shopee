<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cuanku - Produk Pilihan</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #6c2cff, #9d4edd);
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      font-size: 35px;
      margin-bottom: 10px;
    }

    header p {
      opacity: .9;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px;
    }

    .hero {
      background: white;
      padding: 30px 20px;
      text-align: center;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    .hero h2 {
      color: #6c2cff;
      margin-bottom: 10px;
    }

    .product {
      background: white;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .product-icon {
      font-size: 70px;
      margin-bottom: 15px;
    }

    .product h2 {
      margin-bottom: 10px;
    }

    .price {
      color: #6c2cff;
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0;
    }

    .btn {
      display: inline-block;
      background: #6c2cff;
      color: white;
      padding: 15px 30px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: .2s;
    }

    .btn:hover {
      transform: scale(1.05);
      background: #5420cc;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>💰 Cuanku</h1>
    <p>Temukan produk pilihan dengan harga menarik</p>
  </header>

  <main class="container">

    <section class="hero">
      <h2>🔥 Produk Pilihan</h2>
      <p>Jangan lewatkan produk menarik berikut!</p>
    </section>

    <section class="product">

      <div class="product-icon">🛍️</div>

      <h2>Produk Pilihan Shopee</h2>

      <p>
        Klik tombol di bawah untuk melihat produk
        dan melakukan pembelian di Shopee.
      </p>

      <div class="price">
        Cek Harga di Shopee
      </div>

      <a
        href="https://id.shp.ee/njhHMgzc"
        target="_blank"
        rel="noopener noreferrer"
        class="btn"
      >
        🛒 Beli Sekarang
      </a>

    </section>

  </main>

  <footer>
    © 2026 Cuanku
  </footer>

</body>
</html>
